services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: recovery_meal
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recovery_meal"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/recovery_meal
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_MODE: ${AI_MODE:-live}
      APP_ENV: development
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./uploads:/app/uploads"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  postgres_data:

