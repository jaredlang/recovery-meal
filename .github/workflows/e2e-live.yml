name: Live AI Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run live AI and image journey
        working-directory: e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:live
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-ai-failure
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
      - name: Remove E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
